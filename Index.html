<!DOCTYPE html>

<head>

    <style>
        /* SITE 1 CSS - FULL */
        #site1 {
            margin: 0; padding: 0; background-color: #000; display: flex;
            justify-content: center; align-items: center; height: 100vh;
            overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: fixed; width: 100%; top: 0; left: 0; z-index: 100;
        }
        .mobile-container {
            width: 360px; height: 640px; background: #000; border-radius: 35px;
            position: relative; border: 1px solid #1a1a1a; overflow: hidden;
            display: flex; flex-direction: column; align-items: center;
        }
        .stars {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle, #fff 1px, transparent 1px);
            background-size: 50px 50px; opacity: 0.1; animation: drift 20s linear infinite; z-index: 1;
        }
        @keyframes drift { from { transform: translateY(0); } to { transform: translateY(640px); } }
        .header {
            text-align: center; color: #ffb3d1; margin-top: 60px; font-size: 16px;
            letter-spacing: 1px; text-shadow: 0 0 10px #ff3385; font-weight: bold; z-index: 2;
        }
        .heart-container {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 250px; height: 250px; display: flex; justify-content: center;
            align-items: center; cursor: pointer; -webkit-tap-highlight-color: transparent; z-index: 2;
        }
        .heart-svg {
            width: 160px; height: 160px; fill: #ff3385; filter: drop-shadow(0 0 20px #ff3385);
            animation: heartbeat 1.3s infinite ease-in-out;
        }
        @keyframes heartbeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
        .text-simple {
            position: absolute; color: #ffb3d1; font-size: 18px; font-weight: bold;
            pointer-events: none; z-index: 100; text-shadow: 0 0 8px #ff3385;
            animation: floatUpFade 2.5s ease-out forwards; background: rgba(255, 255, 255, 0.05);
            padding: 8px 15px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(2px);
        }
        @keyframes floatUpFade { 0% { transform: translate(-50%, 0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(-50%, -120px); opacity: 0; } }
        .footer-button { position: absolute; bottom: 50px; z-index: 3; }
        .go-btn {
            background-color: #ff3385; color: white; border: none; padding: 12px 40px;
            border-radius: 25px; font-size: 18px; font-weight: bold; text-transform: uppercase;
            cursor: pointer; box-shadow: 0 0 15px #ff3385, 0 0 5px white; transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none; display: inline-block;
        }

        /* SITE 2 CSS - FULL PERFORMANCE */
        #site2 { display: none; margin: 0; background-color: #000; overflow: hidden; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; }

        .card {

            text-align: center; color: white; box-shadow: 0 0 30px rgba(255, 20, 147, 0.15);

        function createSnowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, 'white'); grad.addColorStop(0.5, 'rgba(255,255,255,0.4)'); grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad; ctx.fillRect(0,0,64,64);
            return new THREE.CanvasTexture(canvas);
        }

        function createRoundedAlphaMap() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const r = 60;
            ctx.fillStyle = 'black'; ctx.fillRect(0,0,512,512);
            ctx.fillStyle = 'white'; ctx.beginPath();
            ctx.moveTo(r,0); ctx.lineTo(512-r,0); ctx.quadraticCurveTo(512,0,512,r);
            ctx.lineTo(512,512-r); ctx.quadraticCurveTo(512,512,512-r,512);
            ctx.lineTo(r,512); ctx.quadraticCurveTo(0,512,0,512-r);
            ctx.lineTo(0,r); ctx.quadraticCurveTo(0,0,r,0);
            ctx.fill();
            return new THREE.CanvasTexture(canvas);
        }

        function spawnImage(zPos) {
            if (currentIndex >= baseUrls.length) return;
            const url = baseUrls[currentIndex++];
            textureLoader.load(url, (tex) => {
                const aspect = tex.image.width / tex.image.height;
                const mat = new THREE.MeshLambertMaterial({ 
                    map: tex, alphaMap: roundedAlphaMap, transparent: true, side: THREE.DoubleSide, depthWrite: false 
                });
                const mesh = new THREE.Mesh(new THREE.PlaneGeometry(5, 5/aspect), mat);
                mesh.position.set((Math.random() - 0.5) * 70, (Math.random() - 0.5) * 50, zPos);
                scene.add(mesh);
                movingImages.push(mesh);
            });
        }

        function setupHeartPhase() {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(pCountHeart * 3);
            const targetPositions = new Float32Array(pCountHeart * 3);
            const initialPositions = new Float32Array(pCountHeart * 3);
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 400; canvas.height = 100;
            ctx.fillStyle = 'white'; ctx.font = 'bold 40px Arial';
            ctx.textAlign = 'center'; ctx.fillText('Najemi et Amir', 200, 60);
            const imageData = ctx.getImageData(0, 0, 400, 100).data;
            const textPoints = [];
            for (let y = 0; y < 100; y += 2) {
                for (let x = 0; x < 400; x += 2) {
                    if (imageData[(y * 400 + x) * 4] > 128) {
                        textPoints.push({ x: (x - 200) * 0.04, y: (50 - y) * 0.04 });
                    }
                }
            }
            for (let i = 0; i < pCountHeart; i++) {
                let tx, ty, tz;
                if (i < textPoints.length && i < pCountHeart * 0.4) {
                    tx = textPoints[i].x; ty = textPoints[i].y + 1; tz = 0;
                } else {
                    let t = Math.random() * Math.PI * 2;
                    let x = 16 * Math.pow(Math.sin(t), 3);
                    let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                    let z = (Math.random() - 0.5) * 8; 
                    let scale = 0.45;
                    tx = x * scale; ty = y * scale + 1.5; tz = z * 0.2;
                }
                targetPositions[i * 3] = tx; targetPositions[i * 3 + 1] = ty; targetPositions[i * 3 + 2] = tz;
                initialPositions[i * 3] = (Math.random() - 0.5) * 50;
                initialPositions[i * 3 + 1] = -20 - Math.random() * 10;
                initialPositions[i * 3 + 2] = (Math.random() - 0.5) * 50;
                positions[i * 3] = initialPositions[i * 3];
                positions[i * 3 + 1] = initialPositions[i * 3 + 1];
                positions[i * 3 + 2] = initialPositions[i * 3 + 2];
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('targetPos', new THREE.BufferAttribute(targetPositions, 3));
            geometry.setAttribute('initialPos', new THREE.BufferAttribute(initialPositions, 3));
            const sprite = new THREE.TextureLoader().load('https://threejs.org/examples/textures/sprites/disc.png');
            heartParticles = new THREE.Points(geometry, new THREE.PointsMaterial({
                size: 0.15, color: 0x00ccff, map: sprite, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
            }));
            scene.add(heartParticles);
            phase = 2; 
        }

        scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x000000, 20, 350); 
        camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 20);
        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('site2').appendChild(renderer.domElement);
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        textureLoader = new THREE.TextureLoader();
        roundedAlphaMap = createRoundedAlphaMap();
        snowTexture = createSnowTexture();

        for(let i=0; i < simultaneousCount; i++) spawnImage(-i * spacing);

        snowGeometry = new THREE.BufferGeometry();
        const verts = [];
        for(let i=0; i<particleCount; i++) {
            verts.push(THREE.MathUtils.randFloatSpread(350), THREE.MathUtils.randFloatSpread(350), THREE.MathUtils.randFloatSpread(700));
        }
        snowGeometry.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
        snowParticles = new THREE.Points(snowGeometry, new THREE.PointsMaterial({ 
            color: 0x00ccff, size: 0.35, map: snowTexture, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false 
        }));
        scene.add(snowParticles);
        scene.add(new THREE.AmbientLight(0xffffff, 1.2));

        function animate() {
            requestAnimationFrame(animate);
            if (phase === 1) {
                const p = snowGeometry.attributes.position.array;
                for(let i=2; i<p.length; i+=3) { p[i] += 0.25; if(p[i] > 50) p[i] = -600; }
                snowGeometry.attributes.position.needsUpdate = true;
                for(let i=movingImages.length-1; i>=0; i--) {
                    const m = movingImages[i]; m.position.z += imageSpeed; m.lookAt(camera.position);
                    if(m.position.z > 35) {
                        scene.remove(m); movingImages.splice(i,1);
                        if (currentIndex < baseUrls.length) {
                            const lastZ = movingImages.length > 0 ? movingImages[movingImages.length-1].position.z : 0;
                            spawnImage(lastZ - spacing);
                        }
                    }
                }
                if (currentIndex >= baseUrls.length && movingImages.length === 0) {
                    scene.remove(snowParticles); setupHeartPhase();
                }
            } else if (phase === 2) {
                if (heartProgress < 1) heartProgress += 0.003;
                else {
                    if(heartEndTime === 0) heartEndTime = Date.now();
                    if(Date.now() - heartEndTime > 15000) { startThirdSite(); return; }
                }
                const pos = heartParticles.geometry.attributes.position.array;
                const target = heartParticles.geometry.attributes.targetPos.array;
                const initial = heartParticles.geometry.attributes.initialPos.array;
                for (let i = 0; i < pCountHeart; i++) {
                    let idx = i * 3;
                    let angle = heartProgress * Math.PI * 8 + (i * 0.005);
                    let radius = (1 - heartProgress) * 15;
                    if (heartProgress < 1) {
                        pos[idx] = THREE.MathUtils.lerp(initial[idx], target[idx], heartProgress) + Math.cos(angle) * radius;
                        pos[idx + 1] = THREE.MathUtils.lerp(initial[idx + 1], target[idx + 1], heartProgress);
                        pos[idx + 2] = THREE.MathUtils.lerp(initial[idx + 2], target[idx + 2], heartProgress) + Math.sin(angle) * radius;
                    } else {
                        let pulse = 1 + Math.sin(Date.now() * 0.002 + i * 0.1) * 0.01;
                        pos[idx] = target[idx] * pulse; pos[idx + 1] = target[idx + 1] * pulse; pos[idx + 2] = target[idx + 2] * pulse;
                    }
                }
                heartParticles.geometry.attributes.position.needsUpdate = true;
                heartParticles.rotation.y += 0.003;
            }
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    }

    /* SITE 3 JS - THE FULL FIREWORKS & CARD */
    function startThirdSite() {
        document.getElementById('site2').style.display = 'none';
        document.getElementById('site3').style.display = 'flex';
        initSite3();
    }

    function initSite3() {
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        let particles = []; let fireworks = [];
        class Firework {
            constructor() {
                this.x = Math.random() * canvas.width; this.y = canvas.height;
                this.targetY = canvas.height / 2.5 + (Math.random() - 0.5) * 100;
                this.speed = 4 + Math.random() * 2; this.color = `hsl(${Math.random() * 30 + 330}, 100%, 65%)`;
            }
            update() { this.y -= this.speed; if (this.y <= this.targetY) { createHeartExplosion(this.x, this.y, this.color); return true; } return false; }
            draw() { ctx.beginPath(); ctx.arc(this.x, this.y, 2, 0, Math.PI * 2); ctx.fillStyle = this.color; ctx.fill(); }
        }
        class Particle {
            constructor(x, y, color, tx, ty) {
                this.x = x; this.y = y; this.color = color; this.tx = tx; this.ty = ty; this.alpha = 1; this.decay = 0.008 + Math.random() * 0.01;
            }
            update() { this.x += (this.tx - this.x) * 0.08; this.y += (this.ty - this.y) * 0.08; this.alpha -= this.decay; }
            draw() {
                ctx.save(); ctx.globalAlpha = this.alpha; ctx.beginPath(); ctx.lineWidth = 2; ctx.lineCap = 'round';
                ctx.moveTo(this.x, this.y); ctx.lineTo(this.x + (this.tx - this.x) * 0.1, this.y + (this.ty - this.y) * 0.1);
                ctx.strokeStyle = this.color; ctx.stroke(); ctx.restore();
            }
        }
        function createHeartExplosion(x, y, color) {
            const count = 120;
            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2; const r = 9; 
                const tx = x + r * 16 * Math.pow(Math.sin(angle), 3);
                const ty = y - r * (13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle));
                particles.push(new Particle(x, y, color, tx, ty));
            }
        }
        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.18)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            if (Math.random() < 0.04) fireworks.push(new Firework());
            fireworks = fireworks.filter(f => { f.draw(); return !f.update(); });
            particles = particles.filter(p => { p.update(); p.draw(); return p.alpha > 0; });
            requestAnimationFrame(animate);
        }
        animate();
    }
</script>
