name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download libGTASA from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a
          gh release download libs --repo "${{ github.repository }}" --pattern "libGTASA_arm64.so" --dir /tmp/libs
          gh release download libs --repo "${{ github.repository }}" --pattern "libGTASA_arm32.so" --dir /tmp/libs
          cp /tmp/libs/libGTASA_arm64.so app/src/main/jniLibs/arm64-v8a/libGTASA.so
          cp /tmp/libs/libGTASA_arm32.so app/src/main/jniLibs/armeabi-v7a/libGTASA.so
          ls -lh app/src/main/jniLibs/*/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: app/build/outputs/apk/debug/*.apk
