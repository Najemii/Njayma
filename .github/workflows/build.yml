name: Build AntiServerFullFix (Linux .so)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install 32-bit tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-multilib gcc-multilib make

      - name: Get AMX headers (the amx/amx.h in the zip is empty)
        run: |
          SRC=$(dirname "$(find . -name makefile -not -path './.git/*' | head -1)")
          echo "Project folder: $SRC"
          found=0
          for repo in Zeex/samp-plugin-sdk udan11/samp-plugin-sdk; do
            rm -rf /tmp/sdk
            git clone --depth 1 "https://github.com/$repo.git" /tmp/sdk || continue
            if [ -s /tmp/sdk/amx/amx.h ]; then
              echo "AMX headers found in $repo"
              found=1
              break
            fi
          done
          test "$found" = 1 || { echo "ERROR: amx/amx.h not found in any SDK repo"; exit 1; }
          mkdir -p "$SRC/amx"
          cp -r /tmp/sdk/amx/* "$SRC/amx/"
          ls -l "$SRC/amx"
          echo "SRC=$SRC" >> "$GITHUB_ENV"

      - name: Remove the SELinux-disabling line
        run: |
          sed -i 's/system("setenforce 0");//' "$SRC/AntiServerFullAttack.cxx"
          ! grep -n "setenforce" "$SRC/AntiServerFullAttack.cxx"

      - name: Build
        run: |
          cd "$SRC"
          make AntiServerFullFix
          ls -l AntiServerFullFix.so
          file AntiServerFullFix.so

      - name: Upload .so
        uses: actions/upload-artifact@v4
        with:
          name: AntiServerFullFix
          path: ${{ env.SRC }}/AntiServerFullFix.so
