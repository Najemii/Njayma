
name: Njayma APK Extract and Rebuild

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      mode:
        description: "Choose operation"
        required: true
        type: choice
        options:
          - extract
          - rebuild
        default: extract

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool zip unzip jq curl

      - name: Select Operation
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "value=extract" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Original APK
        if: steps.mode.outputs.value == 'extract'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p input project output

          gh release download vvi \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "NewlifeLauncherM.apk" \
            --dir input

          test -f input/NewlifeLauncherM.apk

          cp input/NewlifeLauncherM.apk project/original.apk

      - name: Download JADX
        if: steps.mode.outputs.value == 'extract'
        run: |
          URL=$(curl -fsSL \
            https://api.github.com/repos/skylot/jadx/releases/latest \
            | jq -r '.assets[] |
              select(.name | test("^jadx-.*\\.zip$")) |
              .browser_download_url' | head -n 1)

          test -n "$URL"

          curl -fL "$URL" -o jadx.zip

          mkdir jadx
          unzip -q jadx.zip -d jadx

      - name: Extract APK Resources and Smali
        if: steps.mode.outputs.value == 'extract'
        run: |
          apktool d -f project/original.apk \
            -o project/apktool

          echo "APK extraction completed."

      - name: Decompile Java
        if: steps.mode.outputs.value == 'extract'
        run: |
          JADX=$(find jadx -type f -name jadx -perm -111 | head -n 1)

          test -n "$JADX"

          mkdir -p project/java

          "$JADX" \
            --show-bad-code \
            --escape-unicode \
            -d project/java \
            project/original.apk || {
              echo "WARNING: JADX found errors."
              echo "Keeping recovered Java files."
            }

          echo "JADX extraction finished."
          echo "Recovered Java files:"
          find project/java -type f | head -50

      - name: Create Source ZIP
        if: steps.mode.outputs.value == 'extract'
        run: |
          mkdir -p output

          zip -qr \
            output/Njayma-Recovered-Source.zip \
            project

          ls -lh output/

          test -f output/Njayma-Recovered-Source.zip

      - name: Upload Source ZIP to Release
        if: steps.mode.outputs.value == 'extract'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload vvi \
            output/Njayma-Recovered-Source.zip \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          echo "Source ZIP uploaded successfully."

      - name: Download Edited Source ZIP
        if: steps.mode.outputs.value == 'rebuild'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p input

          gh release download vvi \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "Njayma-Edited-Source.zip" \
            --dir input

          unzip -q input/Njayma-Edited-Source.zip

          test -d project/apktool

      - name: Rebuild Modified APK
        if: steps.mode.outputs.value == 'rebuild'
        run: |
          apktool b project/apktool \
            -o app-unsigned.apk

          test -f app-unsigned.apk

      - name: Sign Modified APK
        if: steps.mode.outputs.value == 'rebuild'
        run: |
          BT=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 -maxdepth 1 -type d \
            | sort -V | tail -n 1)

          keytool -genkeypair \
            -keystore njayma.keystore \
            -alias njayma \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Njayma"

          "$BT/zipalign" -f -p 4 \
            app-unsigned.apk app-aligned.apk

          "$BT/apksigner" sign \
            --ks njayma.keystore \
            --ks-key-alias njayma \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out Njayma-Modified.apk \
            app-aligned.apk

          "$BT/apksigner" verify Njayma-Modified.apk

      - name: Upload Modified APK to Release
        if: steps.mode.outputs.value == 'rebuild'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload vvi \
            Njayma-Modified.apk \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          echo "Modified APK uploaded."

      - name: Save ZIP and APK Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Njayma-Workflow-Output
          path: |
            output/*.zip
            Njayma-Modified.apk
          if-no-files-found: ignore
