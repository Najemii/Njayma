name: Build AntiServerFullFix (Linux .so)

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install 32-bit build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib g++-multilib

      - name: Get AMX headers (the amx/amx.h in the zip is empty)
        run: |
          git clone --depth 1 https://github.com/Zeex/samp-plugin-sdk.git /tmp/sdk
          SRC=$(dirname "$(find . -name makefile -not -path './.git/*' | head -1)")
          echo "Project folder: $SRC"
          mkdir -p "$SRC/amx"
          cp -r /tmp/sdk/amx/* "$SRC/amx/"
          echo "SRC=$SRC" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cd "$SRC"
          make AntiServerFullFix
          ls -l AntiServerFullFix.so
          file AntiServerFullFix.so

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: AntiServerFullFix-linux
          path: ${{ env.SRC }}/AntiServerFullFix.so
