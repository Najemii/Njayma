name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ls -la
          mkdir -p proj
          unzip -q "$(ls ./*.zip | head -1)" -d proj
          G=$(find proj -maxdepth 3 -name settings.gradle.kts | head -1)
          if [ -z "$G" ]; then
            echo "settings.gradle.kts not found. Files:"
            find proj -maxdepth 3 | head -60
            exit 1
          fi
          echo "PROJ=$(dirname "$G")" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SpeedLife-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
